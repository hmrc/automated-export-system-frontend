include "frontend.conf"

appName="automated-export-system-frontend"

play.frontend.host = "http://localhost:5002"

play.http.router = prod.Routes

play.http.errorHandler = "uk.gov.hmrc.automatedexportsystemfrontend.handlers.ErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
play.modules.enabled += "uk.gov.hmrc.automatedexportsystemfrontend.config.Module"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.frontend.FrontendModule"


play.filters.enabled += play.filters.csp.CSPFilter

play.i18n.langs = ["en", "cy"]

microservice {
    services {
      auth {
        protocol = http
        host     = localhost
        port     = 8500
      }

      feedback-frontend {
        protocol = http
        host     = localhost
        port     = 9514
      }

      automated-export-system {
        host = localhost
        port = 5000
        context ="/automated-export-system"
        }
    }
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "automated-export-system-frontend"
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

session {
  timeoutSeconds = 900
}

mongodb {
  uri                 = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 900
}

urls {
   ggSignInUrl = "http://localhost:9949/auth-login-stub/gg-sign-in"
   ggSignOutUrl = "http://localhost:9553/bas-gateway/sign-out-without-state"
   eccSubscribeUrl = "http://localhost:6750/customs-enrolment-services/gagmr/subscribe"
   userResearchUrl = "#"
   authContinueBaseUrl = "http://localhost:9000/automated-export-system"

}

host = "http://localhost:5002"

accessibility-statement{
  service-path = "/automated-export-system-frontend"
}

tracking-consent-frontend {
  gtm.container = "transitional"
}

play-frontend-hmrc {
    useRebrand = false
}


features {
  welsh-translation: true
}
